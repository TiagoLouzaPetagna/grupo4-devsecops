name: Grupo 4 - demonstracao red-green

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Cenario que sera demonstrado
        required: true
        default: green
        type: choice
        options:
          - red
          - green

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Preparar código do Juice Shop
        shell: pwsh
        run: |
          ./scripts/fetch-target.ps1
          New-Item -ItemType Directory -Force ./reports | Out-Null

      - name: Executar cenario vulneravel
        if: ${{ inputs.scenario == 'red' }}
        shell: pwsh
        run: |
          docker compose --profile tools run --rm semgrep semgrep scan `
            --config auto `
            --json `
            --output /workspace/reports/semgrep-red.json `
            /workspace/target/juice-shop/routes/search.ts
          docker compose --profile tools run --rm gate node /workspace/scripts/quality-gate.mjs `
            --semgrep /workspace/reports/semgrep-red.json `
            --threshold HIGH `
            --expect pass

      - name: Executar cenario corrigido
        if: ${{ inputs.scenario == 'green' }}
        shell: pwsh
        run: |
          ./scripts/prepare-green.ps1
          docker compose --profile tools run --rm semgrep semgrep scan `
            --config auto `
            --json `
            --output /workspace/reports/semgrep-green.json `
            /workspace/target/juice-shop-fixed/routes/search.ts
          docker compose --profile tools run --rm gate node /workspace/scripts/quality-gate.mjs `
            --semgrep /workspace/reports/semgrep-green.json `
            --threshold HIGH `
            --expect pass

      - name: Publicar relatorio do Semgrep
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: semgrep-${{ inputs.scenario }}
          path: reports/semgrep-${{ inputs.scenario }}.json
