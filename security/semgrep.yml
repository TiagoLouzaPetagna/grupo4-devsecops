rules:
  - id: juice-shop.typescript.sql-injection
    message: >-
      Query SQL construída com interpolação de template. Use parâmetros/replacements
      do Sequelize para separar dados da instrução SQL.
    languages: [typescript]
    severity: ERROR
    pattern-regex: 'sequelize\.query\(`[^`]*\$\{'
    paths:
      exclude:
        - "**/*.spec.ts"
        - "**/test/**"
    metadata:
      category: security
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      devsecops_severity: HIGH
      cwe: CWE-89
      owasp: A03:2021 - Injection

  - id: juice-shop.typescript.dynamic-eval
    message: >-
      eval() executa texto como código. Remova a avaliação dinâmica ou substitua-a
      por um interpretador restrito para o domínio esperado.
    languages: [typescript]
    severity: ERROR
    pattern: eval(...)
    paths:
      exclude:
        - "**/*.spec.ts"
        - "**/test/**"
    metadata:
      category: security
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      devsecops_severity: HIGH
      cwe: CWE-95
      owasp: A03:2021 - Injection

  - id: juice-shop.angular.bypass-security-trust-html
    message: >-
      bypassSecurityTrustHtml desativa a sanitização do Angular. Confirme a origem
      do valor e prefira renderização segura sem ignorar o mecanismo de proteção.
    languages: [typescript]
    severity: WARNING
    pattern: $SANITIZER.bypassSecurityTrustHtml(...)
    paths:
      exclude:
        - "**/*.spec.ts"
        - "**/test/**"
    metadata:
      category: security
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      devsecops_severity: MEDIUM
      cwe: CWE-79
      owasp: A03:2021 - Injection

