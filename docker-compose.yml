name: grupo4-devsecops

services:
  juice-shop:
    image: bkimminich/juice-shop:v20.2.0
    environment:
      NODE_ENV: unsafe
      NODE_OPTIONS: --unhandled-rejections=warn
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks:
      - isolated-lab

  semgrep:
    image: semgrep/semgrep:1.172.0
    profiles: ["tools"]
    working_dir: /workspace
    volumes:
      - ./:/workspace

  gate:
    image: node:22-alpine
    profiles: ["tools"]
    working_dir: /workspace
    volumes:
      - ./:/workspace

  zap:
    image: ghcr.io/zaproxy/zaproxy:2.17.0
    profiles: ["tools"]
    depends_on:
      juice-shop:
        condition: service_healthy
    working_dir: /zap/wrk
    volumes:
      - ./security:/zap/wrk/security:ro
      - ./reports:/zap/wrk/reports
    command: ["zap.sh", "-cmd", "-autorun", "/zap/wrk/security/zap-juice-shop.yaml"]
    networks:
      - isolated-lab

networks:
  isolated-lab:
    internal: true
